[package]
name = "voiceagent-esp32"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "ESP32 SDK for the Streamcore Voice Agent server (WebRTC over WHIP)"
license = "MIT"
repository = "https://github.com/streamcoreai/esp32"
readme = "README.md"
keywords = ["esp32", "webrtc", "voice", "whip", "embedded"]
categories = ["embedded", "multimedia::audio"]

[lib]
name = "voiceagent_esp32"
path = "src/lib.rs"

[dependencies]
esp-idf-svc = { version = "0.52", features = ["critical-section"] }
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
log = "0.4"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
embedded-svc = "0.29"
heapless = "0.9"
anyhow = "1"
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
embedded-graphics = "0.8"
mipidsi = "0.8"
display-interface-spi = "0.5"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = true

[profile.dev]
debug = true
opt-level = "z"

[package.metadata.esp-idf-sys]
# These ESP-IDF C components are required by the SDK and are pulled in
# automatically by `esp-idf-sys` for any binary crate that depends on us.
#
#   * `esp_peer` from esp-webrtc-solution — included as a git submodule.
#     After cloning the SDK repo run:  git submodule update --init
#   * `voiceagent_vc_frontend` — wraps ESP-SR AFE (AGC + Noise Suppression).
extra_components = [
    { component_dirs = "components/esp-webrtc-solution/components", components = ["esp_peer"] },
    { component_dirs = "components", components = ["voiceagent_vc_frontend"] }
]
