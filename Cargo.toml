[package]
name = "voiceagent-esp32"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "ESP32 voice agent client — connects to a Streamcore Voice Agent server via WebRTC (WHIP)"
license = "MIT"

[dependencies]
esp-idf-svc = { version = "0.52", features = ["binstart", "critical-section"] }
esp-idf-hal = "0.46"
esp-idf-sys = { version = "0.37", features = ["binstart"] }
log = "0.4"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
embedded-svc = "0.29"
heapless = "0.9"
anyhow = "1"
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
embedded-graphics = "0.8"
mipidsi = "0.8"
display-interface-spi = "0.5"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = true

[profile.dev]
debug = true
opt-level = "z"

[package.metadata.esp-idf-sys]
# The esp_peer C component from esp-webrtc-solution.
# Included as a git submodule.  Run:  git submodule update --init
# voiceagent_vc_frontend wraps ESP-SR AFE (AGC + Noise Suppression) for mic processing.
extra_components = [
    { component_dirs = "components/esp-webrtc-solution/components", components = ["esp_peer"] },
    { component_dirs = "components", components = ["voiceagent_vc_frontend"] }
]
