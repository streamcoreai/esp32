# ESP-IDF Component Manager manifest.
# esp_peer is included via extra_components in Cargo.toml (local clone).
# esp_audio_codec provides Opus encoder/decoder.
# esp-sr provides AFE (Audio Front End) — AGC + Noise Suppression.

dependencies:
  espressif/esp_audio_codec:
    version: "~2.3.0"
  espressif/esp-sr:
    version: "^1.9.0"
  espressif/esp32-camera:
    version: "^2.0.0"
  idf:
    version: ">=5.1.0"
